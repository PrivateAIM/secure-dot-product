[project]
name = "python-template-repo"
version = "0.1.0"
description = ""
authors = [
    {name = "Maximilian Jugl", email = "Maximilian.Jugl@medizin.uni-leipzig.de"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "flame @ git+https://github.com/PrivateAIM/python-sdk-patterns.git@proxy-nodes"
]
license = "Apache-2.0"

[tool.poetry]
packages = [{ include = "secureDotProduct" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
ruff = ">=0.9.0"
pre-commit = ">=4.0.0"
numpy = "^2.5.1"

[tool.ruff]
line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
